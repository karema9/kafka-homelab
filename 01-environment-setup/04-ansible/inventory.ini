[kafka]
server1 ansible_host=<ENTER_IP> ansible_user=ansible-user broker_id=1 kafka_ip=<ENTER_IP>
server2 ansible_host=<ENTER_IP> ansible_user=ansible-user broker_id=2 kafka_ip=<ENTER_IP>
server3 ansible_host=<ENTER_IP> ansible_user=ansible-user broker_id=3 kafka_ip=<ENTER_IP>
server4 ansible_host=<ENTER_IP> ansible_user=ansible-user broker_id=3 kafka_ip=<ENTER_IP>


[all:vars]
ansible_python_interpreter=/usr/bin/python3

kafka_version=3.9.1
kafka_scala_version=2.13
kafka_artifact=kafka_2.13-3.9.1
kafka_download_url=https://dlcdn.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz
kafka_install_dir=/opt/kafka
zookeeper_data_dir=/var/lib/zookeeper
kafka_log_dir=/var/lib/kafka-logs


