---
- name: Deploy Kafka + ZooKeeper cluster
  hosts: kafka
  become: true
  vars:
    kafka_base: "{{ kafka_install_dir }}"
    kafka_home: "{{ kafka_install_dir }}/current"
    zookeeper_servers:
      - { id: 1, host: <ENTER_IP> }
      - { id: 2, host: <ENTER_IP> }
      - { id: 3, host: <ENTER_IP> }
  tasks:

  - name: Install required packages (OpenJDK, wget, tar)
    apt:
      name:
        - openjdk-11-jdk
        - wget
        - tar
      state: present
      update_cache: yes

  - name: Create kafka install dir
    file:
      path: "{{ kafka_base }}"
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Create kafka log dir
    file:
      path: "{{ kafka_log_dir }}"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0755'

  - name: Create zookeeper data dir
    file:
      path: "{{ zookeeper_data_dir }}"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0755'

  - name: Download Kafka tarball
    get_url:
      url: "{{ kafka_download_url }}"
      dest: /tmp/{{ kafka_artifact }}.tgz
      mode: '0644'
    register: kafka_download

  - name: Extract Kafka tarball
    unarchive:
      src: /tmp/{{ kafka_artifact }}.tgz
      dest: "{{ kafka_base }}"
      remote_src: yes
      creates: "{{ kafka_base }}/{{ kafka_artifact }}"

  - name: Check if current is a directory (not a symlink)
    stat:
      path: "{{ kafka_base }}/current"
    register: current_path

  - name: Remove current directory if it exists and is not a symlink
    file:
      path: "{{ kafka_base }}/current"
      state: absent
    when: current_path.stat.exists and current_path.stat.isdir and not current_path.stat.islnk

  - name: Create symlink current -> kafka version
    file:
      src: "{{ kafka_base }}/{{ kafka_artifact }}"
      dest: "{{ kafka_base }}/current"
      state: link
      force: yes

  - name: Ensure ownership of kafka directory
    file:
      path: "{{ kafka_base }}"
      state: directory
      recurse: yes
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"

  - name: Create kafka parent log dir
    file:
      path: "{{ kafka_home }}/logs"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0755'

  - name: Configure zookeeper.properties
    copy:
      dest: "{{ kafka_home }}/config/zookeeper.properties"
      owner: root
      group: root
      mode: '0644'
      content: |
        dataDir={{ zookeeper_data_dir }}
        clientPort=2181
        maxClientCnxns=0
        tickTime=2000
        initLimit=10
        syncLimit=5
        
        # ZooKeeper cluster configuration
        {% for server in zookeeper_servers %}
        server.{{ server.id }}={{ server.host }}:2888:3888
        {% endfor %}

  - name: Create myid file (zookeeper id)
    copy:
      dest: "{{ zookeeper_data_dir }}/myid"
      content: "{{ broker_id }}"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0644'

  - name: Configure kafka server.properties
    copy:
      dest: "{{ kafka_home }}/config/server.properties"
      owner: root
      group: root
      mode: '0644'
      content: |
        # Broker Configuration
        broker.id={{ broker_id }}
        listeners=PLAINTEXT://{{ kafka_ip }}:9092
        advertised.listeners=PLAINTEXT://{{ kafka_ip }}:9092
        log.dirs={{ kafka_log_dir }}
        
        # Security Configuration (SASL disabled)
        security.inter.broker.protocol=PLAINTEXT
        sasl.enabled.mechanisms=
        sasl.mechanism.inter.broker.protocol=PLAIN
        
        # Network Configuration
        num.network.threads=3
        num.io.threads=8
        socket.send.buffer.bytes=102400
        socket.receive.buffer.bytes=102400
        socket.request.max.bytes=104857600
        
        # Log Configuration
        num.partitions=1
        num.recovery.threads.per.data.dir=1
        log.retention.hours=168
        log.segment.bytes=1073741824
        log.retention.check.interval.ms=300000
        
        # Replication Configuration
        offsets.topic.replication.factor=3
        transaction.state.log.replication.factor=3
        transaction.state.log.min.isr=2
        default.replication.factor=3
        min.insync.replicas=2
        
        # ZooKeeper Configuration
        zookeeper.connect={% for server in zookeeper_servers %}{{ server.host }}:2181{% if not loop.last %},{% endif %}{% endfor %}
        
        zookeeper.connection.timeout.ms=18000
        
        # Group Coordinator Configuration
        group.initial.rebalance.delay.ms=0
        
        # Allow auto-creation of topics
        auto.create.topics.enable=true

  - name: Create systemd unit for zookeeper
    copy:
      dest: /etc/systemd/system/zookeeper.service
      content: |
        [Unit]
        Description=Apache Zookeeper
        After=network.target

        [Service]
        Type=simple
        User={{ ansible_user }}
        Environment=KAFKA_HOME={{ kafka_home }}
        ExecStart={{ kafka_home }}/bin/zookeeper-server-start.sh {{ kafka_home }}/config/zookeeper.properties
        ExecStop={{ kafka_home }}/bin/zookeeper-server-stop.sh
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
      mode: '0644'
    notify: reload systemd

  - name: Create systemd unit for kafka
    copy:
      dest: /etc/systemd/system/kafka.service
      content: |
        [Unit]
        Description=Apache Kafka Server
        After=zookeeper.service network.target

        [Service]
        Type=simple
        User={{ ansible_user }}
        Environment=KAFKA_HOME={{ kafka_home }}
        ExecStart={{ kafka_home }}/bin/kafka-server-start.sh {{ kafka_home }}/config/server.properties
        ExecStop={{ kafka_home }}/bin/kafka-server-stop.sh
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
      mode: '0644'
    notify: reload systemd

  - name: Flush handlers to reload systemd
    meta: flush_handlers

  - name: Ensure zookeeper service is enabled & started
    systemd:
      name: zookeeper
      enabled: yes
      state: started

  - name: Wait for ZooKeeper to accept connections
    wait_for:
      host: "{{ kafka_ip | default(ansible_host) }}"
      port: 2181
      timeout: 30

  - name: Ensure kafka service is enabled & started
    systemd:
      name: kafka
      enabled: yes
      state: started

  - name: Wait for Kafka to accept connections
    wait_for:
      host: "{{ kafka_ip | default(ansible_host) }}"
      port: 9092
      timeout: 30

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes