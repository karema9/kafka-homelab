services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      # NOTE: change the host port as the 9092 is being used by the Kafka ansible installation
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: 
      KAFKA_OFFSET_REPLICATION_FACTOR:
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:
      KAFKA_PROCESS_ROLES:
      KAFKA_NODE_ID:
      KAFKA_CONTROLLER_QUORUM_VOTERS:
      KAFKA_LISTENERS:
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAME: CONTROLLER
      KAFKA_LOGS_DIR: /tmp/kraft-conbined-logs
      CLUSTER_ID: # experiment with generating some random id here