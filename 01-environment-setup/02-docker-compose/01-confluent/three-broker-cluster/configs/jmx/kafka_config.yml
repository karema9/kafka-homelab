lowercaseOutputName: false
lowercaseOutputLabelNames: false
rules:
# Special handling for BROKER TOPIC METRICS (MessagesIn, BytesIn, BytesOut)
# This captures the 'topic' label so you can see per-topic data
- pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>(Count|OneMinuteRate)
  name: kafka_server_BrokerTopicMetrics_$1_$3
  labels:
    topic: "$2"

# Catch-all for BrokerTopicMetrics without a topic (Cluster-wide totals)
- pattern: kafka.server<type=BrokerTopicMetrics, name=(.+)><>(Count|OneMinuteRate)
  name: kafka_server_BrokerTopicMetrics_$1_$2

# JVM Metrics (Memory, GC, etc.)
# Maps java.lang:type=Memory... to consistent names
- pattern: 'java.lang<type=Memory><HeapMemoryUsage>(used|committed|max)'
  name: jvm_memory_heap_bytes_$1
- pattern: 'java.lang<type=Memory><NonHeapMemoryUsage>(used|committed|max)'
  name: jvm_memory_nonheap_bytes_$1
- pattern: 'java.lang<type=GarbageCollector, name=(.+)><CollectionTime>(Value)'
  name: jvm_gc_collection_seconds_sum
  labels:
    gc: "$1"
- pattern: 'java.lang<type=OperatingSystem><(ProcessCpuLoad|SystemCpuLoad)>'
  name: os_cpu_load_$1

# Generic Catch-all (Backstop for everything else)
- pattern: kafka.server<type=(.+), name=(.+)><>(Value|Count)
  name: kafka_server_$1_$2_$3
- pattern: kafka.controller<type=(.+), name=(.+)><>(Value|Count)
  name: kafka_controller_$1_$2_$3